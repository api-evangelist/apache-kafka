aid: apache-kafka
name: Apache Kafka
description: >-
  Apache Kafka is an open-source distributed event streaming platform used by thousands of companies for
  high-performance data pipelines, streaming analytics, data integration, and mission-critical applications. It provides
  a REST Proxy API, Kafka Connect REST API, and AsyncAPI for event streaming.
